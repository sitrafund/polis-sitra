version: '3'
services:
  df-participation:
    build:
      target: deps
      args:
        NODE_ENV: "development"
      cache_from: []
      no_cache: true
    command: sh -c "cd /app && npm run dev"
    volumes:
      - ./df-participation:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development